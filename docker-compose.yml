# Skeleton (M0). Services start only once M4 (api) and M5 (dashboard) exist.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AKASHNETRA_HOME: /app
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      AKASHNETRA_HOME: /app
      AKASHNETRA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
